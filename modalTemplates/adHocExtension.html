<div class="modal-header">
  <div class="row">
    <div class="col-md-8 col-sm-8">
      <h3 class="modal-title">
        Ad hoc extensions on {{currentPath}}
      </h3>
    </div>


    <div class="col-md-4 col-sm-4">
      <button class="btn btn-primary pull-right" ng-click="save()">Close</button>
      <button class="btn btn-link pull-right" ng-click="$dismiss()">Cancel</button>


    </div>
  </div>

</div>
<div class="modal-body">


  <div class="row">
    <div class="col-md-3">
      <div class="list-group">
        <div ng-class="{'list-group-item':true,listItemSelected:ext == selectedExt}"
             style="cursor: pointer"
             ng-click="selectExt(ext,$index)"
             ng-repeat="ext in currentExt">

          <span ng-if="canEdit" class="pull-right">
            <i style="color: red" class="glyphicon glyphicon-remove clickable"
             ng-click="deleteExt($index)"></i>
          </span>
          {{ext.url | sdcExtensionName}}
        </div>
      </div>

      <button class="btn-link btn"
              ng-if = "canEdit"
              ng-click="addExt()">Add new extension</button>

      <br/>
      <button class="btn-link btn"
              ng-if = "canEdit"
              ng-click="addExtSet()">Add extension set</button>

    </div>
    <div class="col-md-9">

      <textarea style="font-family: monospace; white-space: pre; overflow: auto;"
                class="form-control" rows="20" ng-model="input.selectedExt"
        ng-change="input.isEdited = true">

      </textarea>

      <div ng-show="input.isEdited" class="clickable pull-right" ng-click="saveChanges(input.selectedExt)">Save changes</div>


    </div>
  </div>


<!--
  <pre>{{currentExt | json}}</pre>
  -->
</div>


<div class="modal-header">

</div>
